services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edutech-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edutech_db}
      POSTGRES_USER: ${POSTGRES_USER:-edutech_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edutech_secret_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edutech_user} -d ${POSTGRES_DB:-edutech_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edutech-redis-dev
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secret_2026}" ]
    ports:
      - "6379:6379"
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret_2026}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: edutech-api-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-edutech_user}:${POSTGRES_PASSWORD:-edutech_secret_2026}@postgres:5432/${POSTGRES_DB:-edutech_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret_2026}@redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal_shared_secret_2026}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-jwt_access_super_secret_key_2026_dev}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-jwt_refresh_super_secret_key_2026_dev}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://guided-wallaby-measured.ngrok-free.app}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-wss://project-3t-academy-live-3vunmpp5.livekit.cloud}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-APIAK2UGEYhMadd}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-KVR8YFo2c2FwZEwCAOMhP2sFzQlwZ7ylmgTdPeRKavV}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-e3075f23d1126bc8bfb3bb679a533e58}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-371c3ac7558bb2bb64f62df8aca59deb}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-12c612ace0b0fc2ad6a41d062695cb0cf419938bc5eeb1cc5ae9fc994dc58114}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-edutech-storage}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:-https://pub-7ab9c21bfa214570bd20463f8f4522c2.r2.dev}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-MBBank}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-0389998888}
      SEPAY_ACCOUNT_HOLDER: ${SEPAY_ACCOUNT_HOLDER:-HOC VIEN CONG NGHE 3T ACADEMY}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      SEPAY_WEBHOOK_URL: ${SEPAY_WEBHOOK_URL:-}
      SEPAY_WEBHOOK_BACKUP_URL: ${SEPAY_WEBHOOK_BACKUP_URL:-}
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile.dev
    container_name: edutech-ai-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-edutech_user}:${POSTGRES_PASSWORD:-edutech_secret_2026}@postgres:5432/${POSTGRES_DB:-edutech_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret_2026}@redis:6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal_shared_secret_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - ./apps/ai-service:/app

volumes:
  pgdata_dev:
  redisdata_dev:
