[project]
name = "edutech-ai-service"
version = "2.0.0"
description = "AI Core Service for EduTech Platform (Hybrid RAG, Live Copilot, Proctoring CV, AI Scheduler)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "numpy>=1.26.0",
    "google-genai>=0.1.0",
    "langfuse>=2.54.0",
    "fastembed>=0.4.0",
    "onnxruntime>=1.20.0",
    "ortools>=9.11.0",
    "python-multipart>=0.0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
