[project]
name = "edutech-ai-service"
version = "2.0.0"
description = "Research-Grade Multi-Model AI Core Service for 3T Academy (Hybrid RRF + Cross-Encoder + LangGraph CRAG, Faster-Whisper ASR + MMR, Two-Tier MediaPipe/YuNet/YOLOv8n ONNX + Gemini Vision Proctoring, OR-Tools CP-SAT)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "numpy>=1.26.0",
    "google-genai>=0.1.0",
    "langfuse>=2.54.0",
    "fastembed>=0.4.0",
    "onnxruntime>=1.20.0",
    "opencv-python-headless>=4.10.0",
    "mediapipe>=0.10.18",
    "faster-whisper>=1.1.0",
    "langgraph>=0.2.50",
    "ortools>=9.11.0",
    "Pillow>=11.0.0",
    "edge-tts>=6.1.19",
    "python-multipart>=0.0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
